name: CODM Daily Gift

on:
  schedule:
    # Every day at 7:00 IST = 1:30 UTC
    - cron: "30 1 * * *"

  workflow_dispatch:

jobs:
  claim-gift:
    runs-on: ubuntu-latest

    environment: prod

    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run CODM Gift Bot
        env:
          NODE_ENV: production
          CODM_PLAYER_ID: ${{ secrets.CODM_PLAYER_ID }}
          CODM_STORE_URL: ${{ secrets.CODM_STORE_URL }}
          HEADLESS: true

        run: npm run claim
